; Normal "pio run" / "pio run -t upload" sadece ucus firmware'ini derler.
; Tezgah testi icin: pio run -e bench -t upload
[platformio]
default_envs = esp32dev

; UCAK karti: ESP32 DevKitC 38 pin (ESP-WROOM-32 / 32D).
; Kablolama: docs/kablolama.html
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; PORT SABIT OLMALI. Kumanda da klasik ESP32 ve USB koprusu uzerinden COM5'te;
; port yazilmazsa PlatformIO listedeki ilkini secip firmware'i yanlis karta
; atiyor. Iki kart artik ayni tur kopru kullandigi icin Aygit Yoneticisi'nde
; birbirine benziyorlar - numaraya bakmadan yukleme yapma.
;
; !! COM6 eski ESP32-C3 kartinin yerel USB portuydu. ESP32 DevKitC ilk
; takildiginda baska bir numara alabilir. Yuklemeden once SADECE ucak kartini
; takip bak:
;   C:\.platformio\penv\Scripts\pio.exe device list
; ve asagidaki iki satiri (bench ortamindakileri de) guncelle.
upload_port  = COM6
monitor_port = COM6

; ESP32Servo kaldirildi: cikislar dogrudan LEDC ile suruluyor (bkz. src/main.cpp)
lib_deps =
    nrf24/RF24@^1.4.11

; ------------------------------------------------------------
; TEZGAH TESTI ortami - telsiz yok, sadece servo/ESC
;   pio run -e bench -t upload
; Servolar burada oynuyorsa yazilim/pin tarafi saglam demektir; oynamiyorsa
; sorun besleme (ESC BEC 5V hatti), ortak GND ya da kablolamadadir.
; Ucus firmware'ine donmek icin: pio run -t upload
; ------------------------------------------------------------
[env:bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port  = COM6
monitor_port = COM6

; src/main.cpp'yi disla, arsivdeki tezgah testini derle
build_src_filter =
    -<*>
    +<../hardware_test/servo_bench_ledc.cpp>
