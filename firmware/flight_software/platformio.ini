; Normal "pio run" / "pio run -t upload" sadece ucus firmware'ini derler.
; Tezgah testi icin: pio run -e bench -t upload
[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; UCAK karti = ESP32-C3'un yerel USB'si (VID:PID 303A:1001) -> COM6
; Kumanda karti CP210x kopru uzerinden COM5'te. Port yazilmazsa PlatformIO
; listedeki ilkini (COM5) secip firmware'i yanlis karta atiyor; bu yuzden
; iki projede de port acikca sabitlendi.
; Kart baska bir USB soketine takilirsa numara degisir:
;   C:\.platformio\penv\Scripts\pio.exe device list
; ile bak ve asagidaki iki satiri guncelle.
upload_port  = COM6
monitor_port = COM6

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32Servo kaldirildi: cikislar dogrudan LEDC ile suruluyor (bkz. src/main.cpp)
lib_deps =
    nrf24/RF24@^1.4.11

; ------------------------------------------------------------
; TEZGAH TESTI ortami - telsiz yok, sadece servo/ESC
;   pio run -e bench -t upload
; Servolar burada oynuyorsa yazilim/pin tarafi saglam demektir; oynamiyorsa
; sorun besleme (UBEC 5V), ortak GND ya da kablolamadadir.
; Ucus firmware'ine donmek icin: pio run -t upload
; ------------------------------------------------------------
[env:bench]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port  = COM6
monitor_port = COM6

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; src/main.cpp'yi disla, arsivdeki tezgah testini derle
build_src_filter =
    -<*>
    +<../hardware_test/servo_bench_ledc.cpp>
