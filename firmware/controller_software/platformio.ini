; ---------------------------------------------------------------------------
; VARSAYILAN ORTAM
; Bu satir olmadan "pio run -t upload" platformio.ini'deki TUM ortamlari
; sirayla yukluyor -> en son rfdiag karta yaziliyor ve kumanda gitmis oluyor.
; default_envs sayesinde -e yazmayi unutsan da sadece kumanda yuklenir.
; Teshis firmware'i icin ortami ACIKCA vermek gerekir:
;   pio run -e rfdiag -t upload -t monitor
; --------------------ya k-------------------------------------------------------
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; KUMANDA karti = CP210x USB-UART koprusu (VID:PID 10C4:EA60) -> COM5
; Ucak karti (ESP32-C3, native USB) COM6'da. Port sabitlenmezse iki proje de
; ayni portu kapip firmware'i yanlis karta atabilir.
upload_port  = COM5
monitor_port = COM5

; CP210x koprusu + uzun/gurultulu USB kablosu yuksek hizda takiliyor:
;   460800 -> "Serial data stream stopped: Possible serial noise or corruption"
;   230400 -> yazmanin ~%82'sinde "A fatal error occurred: The chip stopped
;             responding" (StopIteration / slip reader)
; 115200 sonuna kadar sorunsuz yaziyor. Hiz artirmak istersen once kabloyu
; kisa/ferritli bir tanesiyle degistir, yoksa burayi 115200'de birak.
upload_speed = 115200

lib_deps =
    nrf24/RF24@^1.4.11

; ---------------------------------------------------------------------------
; nRF24 teshis firmware'i - main.cpp yerine diag/rf_diag.cpp derlenir.
; WiFi/web sunucu ACMAZ, sadece SPI testi yapar.
;   pio run -e rfdiag -t upload -t monitor
; Kumandaya donmek icin:
;   pio run -t upload -t monitor
; ---------------------------------------------------------------------------
[env:rfdiag]
extends = env:esp32dev
build_src_filter = -<*> +<../diag/rf_diag.cpp>
