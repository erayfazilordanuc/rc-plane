<text class="sans h2 ink" x="688" y="543">Notes</text>
<text class="sans s13 ink" x="688" y="571">nRF24 VCC → 3V3 (top-left pin). Never 5 V.</text>
<text class="sans s13 ink" x="688" y="595">Board and servos run from a separate 5 V / 3 A UBEC; the ESC's BEC is disabled.</text>
<text class="sans s13 ink" x="688" y="619">10k on GPIO25 holds the ESC line low while the board boots.</text>
<text class="sans s13 ink" x="688" y="643">Keep off GPIO 0, 2, 12, 15, 14 and the flash pins D0–D3 / CMD / CLK.</text>
<text class="sans s13 ink" x="688" y="667">Unplug the LiPo before connecting USB to flash.</text>

