<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" role="img" aria-label="Aircraft wiring. ESP32 DevKitC: GPIO25 to ESC signal with a 10k pull-down, GPIO26 elevator servo, GPIO27 rudder servo, all through a servo rail. The 3S LiPo feeds both a 30 A ESC driving the A2212 motor and a separate 5 V 3 A UBEC, which powers the servo rail and the board 5V pin through a bulk capacitor; the ESC's own BEC is disabled. nRF24L01+ on 3V3 with a 10-100 uF capacitor: MOSI 23, MISO 19, SCK 18, CSN 5, CE 4.">

