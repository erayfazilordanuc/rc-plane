<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730" role="img" aria-label="Airframe top, side and front views as built. Wingspan 1400 mm, constant 200 mm chord, 10 degree dihedral with a single break at the centre, fuselage 1050 mm, wing leading edge 230 mm behind the firewall, CG 278 mm just ahead of the spar at 24 percent chord, stabiliser 400 by 150 mm, ready to fly 1106 g.">

<style>
  .bg{fill:#f6f8fa} .card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}
